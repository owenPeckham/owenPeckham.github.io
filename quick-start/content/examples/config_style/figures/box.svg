<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">A particle bouncing off a wall</title>
  <desc id="d">A square box with a few particles; one particle's path reflects off the right wall, its horizontal velocity reversing.</desc>
  <rect width="420" height="200" rx="12" fill="#f7f8fa"/>
  <rect x="110" y="20" width="200" height="160" fill="#fff" stroke="#2b2d33" stroke-width="2.4"/>
  <g fill="#4f46e5"><circle cx="150" cy="60" r="5"/><circle cx="170" cy="140" r="5"/><circle cx="230" cy="90" r="5"/><circle cx="260" cy="150" r="5"/><circle cx="200" cy="45" r="5"/></g>
  <path d="M220 130 L310 85 L240 50" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="6 4"/>
  <path d="M248 46l-8 4 9 2" fill="none" stroke="#c2410c" stroke-width="2.2"/>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#70747e">
    <text x="318" y="90">v<tspan baseline-shift="sub" font-size="10">x</tspan> → −v<tspan baseline-shift="sub" font-size="10">x</tspan></text>
    <text x="210" y="196" text-anchor="middle">box_size</text>
  </g>
</svg>
