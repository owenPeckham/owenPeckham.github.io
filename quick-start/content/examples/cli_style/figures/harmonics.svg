<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Building a square wave from sines</title>
  <desc id="d">A square wave drawn next to the sum of its first three odd harmonics, which approximates it with ripples near the jumps.</desc>
  <rect width="440" height="200" rx="12" fill="#f7f8fa"/>
  <path d="M20 100h400" stroke="#d6dae1" stroke-width="1.5"/>
  <path d="M30 50h95v100h95v-100h95v100h95" fill="none" stroke="#b7bdc8" stroke-width="2.5"/>
  <path d="M30 100 C 36 62, 44 44, 55 49 S 70 58, 78 52 S 95 44, 102 50 S 116 62, 125 100 C 131 138, 139 156, 150 151 S 165 142, 173 148 S 190 156, 197 150 S 211 138, 220 100 C 226 62, 234 44, 245 49 S 260 58, 268 52 S 285 44, 292 50 S 306 62, 315 100 C 321 138, 329 156, 340 151 S 355 142, 363 148 S 380 156, 387 150 S 401 138, 410 100" fill="none" stroke="#4f46e5" stroke-width="2.4"/>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
    <text x="30" y="186" fill="#70747e">grey: square wave</text>
