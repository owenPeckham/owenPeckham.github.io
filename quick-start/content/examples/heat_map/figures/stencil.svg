<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Five-point stencil</title>
  <desc id="d">A grid cell and its four neighbours; the new temperature uses the centre with weight minus four and each neighbour with weight one.</desc>
  <rect width="420" height="220" rx="12" fill="#f7f8fa"/>
  <g stroke="#d6dae1" stroke-width="1.5">
    <path d="M60 30v160M120 30v160M180 30v160M240 30v160M300 30v160M360 30v160M30 50h360M30 110h360M30 170h360"/>
  </g>
  <g stroke="#4f46e5" stroke-width="2.4">
    <path d="M210 80v-36M210 140v36M180 110h-36M240 110h36"/>
  </g>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
    <circle cx="210" cy="110" r="22" fill="#4f46e5"/>
    <text x="210" y="115" fill="#fff" font-weight="700">−4</text>
    <circle cx="210" cy="44" r="18" fill="#e6e8fb" stroke="#4f46e5" stroke-width="2"/><text x="210" y="49" fill="#14151a">1</text>
    <circle cx="210" cy="176" r="18" fill="#e6e8fb" stroke="#4f46e5" stroke-width="2"/><text x="210" y="181" fill="#14151a">1</text>
    <circle cx="144" cy="110" r="18" fill="#e6e8fb" stroke="#4f46e5" stroke-width="2"/><text x="144" y="115" fill="#14151a">1</text>
    <circle cx="276" cy="110" r="18" fill="#e6e8fb" stroke="#4f46e5" stroke-width="2"/><text x="276" y="115" fill="#14151a">1</text>
    <text x="210" y="212" fill="#70747e" font-size="13">u(i, j) and its four neighbours</text>
  </g>
</svg>
